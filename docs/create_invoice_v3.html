<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rechnung erstellen</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui; padding: 15px; background: #f5f5f5; }
.container { max-width: 600px; margin: 0 auto; padding-bottom: 80px; }
.debug-panel { background: #000; color: #0f0; padding: 15px; margin-bottom: 20px; border-radius: 8px; font-family: monospace; font-size: 11px; max-height: 200px; overflow-y: auto; }
.debug-panel.hidden { display: none; }
.section { background: white; padding: 15px; margin-bottom: 15px; border-radius: 12px; }
label { display: block; margin-bottom: 5px; font-size: 13px; }
input, select, textarea { width: 100%; padding: 10px; margin-bottom: 12px; }
.grid4 { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 10px; }
.item-vat { display: none; }
</style>
</head>

<body>
<div class="container">
<div class="debug-panel hidden" id="debug-panel">
  <div id="debug-log"></div>
</div>

<h1>📄 Rechnung erstellen</h1>

<label>Kundentyp</label>
<button onclick="setClientType('b2c')">B2C</button>
<button onclick="setClientType('b2b')">B2B</button>

<label>Land</label>
<select id="client_country" onchange="calcTotals()">
<option value="DE">DE</option>
<option value="AT">AT</option>
<option value="FR">FR</option>
<option value="NL">NL</option>
<option value="CH">CH</option>
</select>

<label>USt-IdNr.</label>
<input id="client_vat_id" onchange="calcTotals()">

<label>
<input type="checkbox" id="vat_per_item"> MwSt pro Position
</label>

<div id="global_vat_section">
<select id="global_vat_rate" onchange="calcTotals()">
<option value="19">19%</option>
<option value="7">7%</option>
<option value="0">0%</option>
</select>
</div>

<div id="items"></div>
<button onclick="addItem()">+ Position</button>

<div>
<p>Netto: <span id="total_net">0.00</span></p>
<p>MwSt: <span id="total_vat">0.00</span></p>
<p>Gesamt: <span id="total_gross">0.00</span></p>
</div>

<button onclick="createInvoice()">💾 Speichern</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let clientType = 'b2c';
let itemCount = 0;
let loadedProfile = { is_kleinunternehmer: false };

function log(m){ document.getElementById('debug-log').innerHTML += m + '<br>'; }

function setClientType(t){
  clientType = t;
  calcTotals();
}

function detectVatMode({ clientType, buyerCountry, buyerVatId, isKleinunternehmer }) {
  const EU = ['DE','AT','FR','NL'];

  if (isKleinunternehmer) return 'klein';
  if (!EU.includes(buyerCountry)) return 'export';
  if (clientType === 'b2c') return 'standard';
  if (buyerCountry === 'DE') return 'standard';
  if (clientType === 'b2b' && buyerVatId?.trim()) return 'reverse';
  return 'standard';
}

function addItem(){
  itemCount++;
  document.getElementById('items').insertAdjacentHTML('beforeend', `
  <div class="item-row">
    <input class="item-qty" type="number" value="1" onchange="calcTotals()">
    <input class="item-price" type="number" value="0" onchange="calcTotals()">
    <select class="item-vat-rate" onchange="calcTotals()">
      <option value="19">19%</option>
      <option value="7">7%</option>
      <option value="0">0%</option>
    </select>
  </div>`);
}

function calcTotals(){
  const vatMode = detectVatMode({
    clientType,
    buyerCountry: client_country.value,
    buyerVatId: client_vat_id.value,
    isKleinunternehmer: loadedProfile.is_kleinunternehmer
  });

  let totalNet = 0;
  let totalVat = 0;

  document.querySelectorAll('.item-row').forEach(r=>{
    const q = +r.querySelector('.item-qty').value || 0;
    const p = +r.querySelector('.item-price').value || 0;
    const net = q * p;
    totalNet += net;

    if (vatMode === 'standard') {
      const rate = +r.querySelector('.item-vat-rate').value;
      totalVat += net * rate / 100;
    }
  });

  if (vatMode !== 'standard') {
    document.getElementById('global_vat_rate').value = '0';
    document.getElementById('vat_per_item').checked = false;
    document.getElementById('vat_per_item').disabled = true;
  } else {
    document.getElementById('vat_per_item').disabled = false;
  }

  total_net.textContent = totalNet.toFixed(2);
  total_vat.textContent = totalVat.toFixed(2);
  total_gross.textContent = (totalNet + totalVat).toFixed(2);

  log('VAT MODE: ' + vatMode);
}

function createInvoice(){
  const vatMode = detectVatMode({
    clientType,
    buyerCountry: client_country.value,
    buyerVatId: client_vat_id.value,
    isKleinunternehmer: loadedProfile.is_kleinunternehmer
  });

  const data = {
    client_type: clientType,
    vat_mode: vatMode,
    total_net: +total_net.textContent,
    total_vat: +total_vat.textContent,
    total_gross: +total_gross.textContent
  };

  tg.sendData(JSON.stringify(data));
  tg.close();
}

addItem();
calcTotals();
</script>
</body>
</html>
