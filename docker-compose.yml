version: '3.8'

services:
  bot:
    build: .
    container_name: invoice-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - bot-network

  db:
    image: postgres:16-alpine
    container_name: invoice-bot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: invoice_bot
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./database/schema_full.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d invoice_bot"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bot-network

  redis:
    image: redis:7-alpine
    container_name: invoice-bot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - bot-network

volumes:
  pg-data:
  redis-data:

networks:
  bot-network:
    driver: bridge
